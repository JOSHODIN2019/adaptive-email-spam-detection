services:
  - type: web
    name: adaptive-email-spam-detection
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_FULL_EMAIL_BODY
        value: "false"
      - key: PYTHON_VERSION
        value: 3.13.9
